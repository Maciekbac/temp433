name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Same toolchain as the F4HWN firmware Dockerfile
  ARM_GCC_VERSION: 13.3.rel1
  ARM_GCC_TARBALL: arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi.tar.xz
  ARM_GCC_SHA256: 95c011cee430e64dd6087c75c800f04b9c49832cc1000127a92a97f9c8d83af4

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Cache Arm GNU Toolchain
        id: cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/dl
          key: ${{ env.ARM_GCC_TARBALL }}

      - name: Download Arm GNU Toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/dl"
          curl -fsSL -o "$RUNNER_TEMP/dl/$ARM_GCC_TARBALL" \
            "https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/$ARM_GCC_VERSION/binrel/$ARM_GCC_TARBALL"

      - name: Install Arm GNU Toolchain
        run: |
          echo "$ARM_GCC_SHA256  $RUNNER_TEMP/dl/$ARM_GCC_TARBALL" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/toolchain"
          tar -xf "$RUNNER_TEMP/dl/$ARM_GCC_TARBALL" -C "$RUNNER_TEMP/toolchain" --strip-components=1
          echo "$RUNNER_TEMP/toolchain/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/toolchain/bin/arm-none-eabi-gcc" --version | head -1

      - name: Fetch SDK
        run: python3 tools/fetch_sdk.py

      - name: Build
        run: ./build.sh

      - name: Summary
        run: |
          echo "Temp433.app: $(wc -c < temp433.bin) B of 4096 B code" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: Temp433
          path: Temp433.app
          retention-days: 30
          if-no-files-found: error
